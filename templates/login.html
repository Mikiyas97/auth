<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Login</h1>

        <form id="login_form" action="/login" method="POST">
            {% if error %}
            <div style="text-align: center; color: red; margin-bottom: 15px;">{{ error }}</div>
            {% endif %}

            <div class="form-group">
                <label><span class="required">*</span> Email</label>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label><span class="required">*</span> Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>

            <hr>

            <button type="submit" id="login_btn">Login</button>
            <br>
            <button type="button" class="google-signin-btn" style="background-color: #db4437; color: white;">Sign in with Google</button>

            <p class="link">
                Don't have an account?
                <a href="/register">Register</a>
            </p>

        </form>

    </div>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <!-- Custom scripts -->
    <script src="{{ url_for('static', filename='js/firebase-config.js') }}"></script>
    <script src="{{ url_for('static', filename='js/google-auth.js') }}"></script>
    
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>

</html>
