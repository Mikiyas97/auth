<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Form</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Register</h1>

        <div id="message" style="text-align: center; color: red; margin-bottom: 15px;"></div>

        <form id="register_form" action="/register" method="POST">

            <div class="form-group">
                <label><span class="required">*</span> Name</label>
                <input type="text" name="name" required>
            </div>

            <div class="form-group">
                <label><span class="required">*</span> Email</label>
                <input type="email" name="email" required>
            </div>

            <div class="form-group">
                <label><span class="required">*</span> Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label><span class="required">*</span> Confirm password</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>

            <hr>

            <button type="submit" id="register_btn">Register</button>
            <br>
            <button type="button" class="google-signin-btn" style="background-color: #db4437; color: white;">Sign in with Google</button>

            <p class="link">
                Already have an account?
                <a href="/login">Login</a>
            </p>

        </form>

    </div>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <!-- Custom scripts -->
    <script src="{{ url_for('static', filename='js/firebase-config.js') }}"></script>
    <script src="{{ url_for('static', filename='js/google-auth.js') }}"></script>
    
    <script src="{{ url_for('static', filename='js/register.js') }}"></script>
</body>

</html>
